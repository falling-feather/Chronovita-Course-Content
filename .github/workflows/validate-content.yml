name: Validate Chronovita content

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate immutable course archives
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .chronovita/validation-requirements.txt

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check -r .chronovita/validation-requirements.txt

      - name: Test archive validator
        run: python -m unittest discover -s tests -v

      - name: Validate repository policy and archives
        run: python scripts/validate_content_archive.py --repository .
