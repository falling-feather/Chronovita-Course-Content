name: Validate Chronovita content

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate immutable course and asset archives
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .chronovita/validation-requirements.txt

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check -r .chronovita/validation-requirements.txt

      - name: Enforce append-only archives for pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_append_only.py --repository . --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Enforce append-only archives for direct pushes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/check_append_only.py --repository . --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Test archive validator
        run: python -m unittest discover -s tests -v

      - name: Validate repository policy and archives
        run: python scripts/validate_content_archive.py --repository .
